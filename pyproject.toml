[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ontoreview"
version = "1.0.0"
description = "OntoReview is an ontology quality assessment, AI-assisted repair, and documentation tool for OWL, RDFS, SKOS, and LinkML, supporting cross-domain and scientific interoperability evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Tek Raj Chhetri" }]
keywords = ["ontology", "owl", "rdf", "skos", "documentation", "semantic-web", "widoco", "lode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "rdflib>=7.0",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6.0",
  "OntoCheck>=0.1.3,<0.2",
  "requests>=2.32,<3",   # quality metrics (CC BY 4.0, SDLE / CWRU); <0.2: its analysis helpers are used directly
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
reason = ["owlrl>=6.0"]
excel = ["openpyxl>=3.1"]
# cross-domain interoperability: definition generality model (transformers, torch) and the OntoAligner matcher
cdi = ["transformers>=5.13", "torch>=2.8", "ontoaligner>=1.9,<2; python_version < '3.14'"]
ui = ["nicegui>=4.0; python_version >= '3.11'"]
all = ["owlrl>=6.0", "openpyxl>=3.1", "nicegui>=4.0; python_version >= '3.11'"]
dev = ["pytest>=8", "ruff>=0.5", "owlrl>=6.0", "openpyxl>=3.1"]

[project.scripts]
ontoreview = "ontoreview.cli:app"
ontoreview-ui = "ontoreview.ui:main"

[project.urls]
Homepage = "https://github.com/sensein/ontoreview"
Repository = "https://github.com/sensein/ontoreview"
Issues = "https://github.com/sensein/ontoreview/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoreview"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_evaluators: run the real ROBOT/OOPS! dispatch (with stubbed tools) instead of the offline default",
           "real_ontocheck: run the real OntoCheck metrics (in-process, network checks off)",
           "real_iri: run the real IRI checks (offline unless the test says otherwise)",
           "real_cdi: run the cross-domain interoperability evaluator in builds (its inputs stay offline)",
           "ontoaligner: run the real OntoAligner matcher (slow import; skipped unless ONTOREVIEW_TEST_ONTOALIGNER=1)"]
