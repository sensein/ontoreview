[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ontoreview"
version = "0.1.0"
description = "Beautiful, self-contained documentation for OWL, RDFS and SKOS ontologies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Tek Raj Chhetri" }]
keywords = ["ontology", "owl", "rdf", "skos", "documentation", "semantic-web", "widoco", "lode"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "rdflib>=7.0",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
reason = ["owlrl>=6.0"]
excel = ["openpyxl>=3.1"]
all = ["owlrl>=6.0", "openpyxl>=3.1"]
dev = ["pytest>=8", "ruff>=0.5", "owlrl>=6.0", "openpyxl>=3.1"]

[project.scripts]
ontoreview = "ontoreview.cli:app"

[project.urls]
Homepage = "https://github.com/tekrajchhetri/ontoreview"

[tool.hatch.build.targets.wheel]
packages = ["src/ontoreview"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
