<section class="section section-wide" id="{{ s.id }}">
  <h2><span class="secno">{{ s.number }}</span> {{ s.title }}</h2>
  <figure class="figure" id="figure-graph" data-notation="{{ ui.graph_notation }}">
    <div class="figure-tools">
      <input id="g-focus" type="search" placeholder="{{ t('graph_focus') }}" list="g-terms" aria-label="{{ t('graph_focus') }}">
      <datalist id="g-terms"></datalist>
      <label class="check"><input type="checkbox" id="g-prop"> {{ t('graph_properties') }}</label>
      <select id="g-notation" aria-label="Notation">
        <option value="vowl">VOWL</option>
        <option value="uml">UML</option>
      </select>
      <select id="g-layout" aria-label="Layout">
        <option value="hierarchy">Hierarchy</option>
        <option value="cose">Force</option>
        <option value="concentric">Concentric</option>
      </select>
      <button class="textbtn" id="g-reset">{{ t('reset') }}</button>
      <button class="textbtn" id="g-png">PNG</button>
      <button class="textbtn" id="g-expand" data-expand="{{ t('expand') }}" data-collapse="{{ t('collapse') }}">{{ t('expand') }}</button>
    </div>
    <div id="cy" class="graph" role="img" aria-label="{{ t('figure_caption', title=meta.title or 'the ontology') }} {{ t('graph_text_alt') }}"></div>
    <div class="legend legend-uml" aria-hidden="true">
      <span><svg width="44" height="12"><line x1="10" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="1.4"/><path d="M1 6 L11 1 L11 11 Z" fill="var(--paper)" stroke="currentColor" stroke-width="1.2"/></svg> {{ t('legend_sub') }}</span>
      <span><svg width="44" height="12"><line x1="10" y1="6" x2="44" y2="6" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.5 2.5"/><path d="M1 6 L11 1 L11 11 Z" fill="var(--paper)" stroke="currentColor" stroke-width="1.2"/></svg> {{ t('legend_eq') }}</span>
      <span class="legend-prop"><svg width="44" height="12"><line x1="0" y1="6" x2="36" y2="6" stroke="currentColor" stroke-width="1.2" stroke-dasharray="5 3"/><path d="M34 2 L43 6 L34 10" fill="none" stroke="currentColor" stroke-width="1.2"/></svg> {{ t('legend_prop') }}</span>
      <span><svg width="30" height="14"><rect x="1" y="1" width="28" height="12" fill="none" stroke="currentColor"/></svg> {{ t('legend_class') }}</span>
    </div>
    <div class="legend legend-vowl" aria-hidden="true">
      <span><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="var(--vowl-class)" stroke="var(--vowl-stroke)" stroke-width="1.2"/></svg> {{ t('legend_class_v') }}</span>
      <span><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="var(--vowl-class)" stroke="var(--vowl-stroke)" stroke-width="1"/><circle cx="9" cy="9" r="5.8" fill="none" stroke="var(--vowl-stroke)" stroke-width="1"/></svg> {{ t('legend_defined') }}</span>
      <span><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="var(--vowl-external)" stroke="var(--vowl-stroke)" stroke-width="1.2"/></svg> {{ t('legend_external') }}</span>
      <span><svg width="46" height="12"><line x1="10" y1="6" x2="46" y2="6" stroke="var(--vowl-stroke)" stroke-width="1.3" stroke-dasharray="5 3"/><path d="M1 6 L11 1 L11 11 Z" fill="var(--paper)" stroke="var(--vowl-stroke)" stroke-width="1.2"/></svg> {{ t('legend_sub') }}</span>
      <span><svg width="34" height="14"><rect x="1" y="1" width="32" height="12" rx="3" fill="var(--vowl-oprop)"/></svg> {{ t('legend_oprop') }}</span>
      <span><svg width="34" height="14"><rect x="1" y="1" width="32" height="12" rx="3" fill="var(--vowl-dprop)"/></svg> {{ t('legend_dprop') }}</span>
      <span><svg width="34" height="14"><rect x="1" y="1" width="32" height="12" fill="var(--vowl-literal)" stroke="var(--vowl-stroke)" stroke-dasharray="3 2"/></svg> {{ t('legend_literal') }}</span>
    </div>
    <figcaption><span class="fig-label">{{ t('figure') }} 1.</span> {{ t('figure_caption', title=meta.title or 'the ontology') }} <span id="g-status" class="muted" role="status" aria-live="polite"></span></figcaption>
  </figure>
</section>
