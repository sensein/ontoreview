id: https://w3id.org/example/personinfo
name: personinfo
title: Person Information Model
description: |-
  A LinkML model for people, organizations and their relationships.
  Used to test **OntoReview**'s LinkML support.
version: 0.3.0
license: CC0
created_by: https://orcid.org/0000-0000-0000-0002
contributors:
  - Grace Hopper
created_on: "2025-02-01"
last_updated_on: "2026-10-15"
keywords: [people, organizations]
prefixes:
  linkml: https://w3id.org/linkml/
  personinfo: https://w3id.org/example/personinfo/
  schema: http://schema.org/
  ORCID: https://orcid.org/
default_prefix: personinfo
default_range: string
imports:
  - linkml:types
  - core

classes:
  Person:
    is_a: NamedThing
    mixins: [HasAliases]
    class_uri: schema:Person
    description: A person (alive, dead, undead, or fictional).
    aliases: [human being]
    exact_mappings: [schema:Person]
    slots:
      - primary_email
      - birth_date
      - age_in_years
      - gender
      - employed_by
    slot_usage:
      primary_email:
        required: true
    examples:
      - value: "Ada Lovelace"
        description: a famous mathematician
  Organization:
    is_a: NamedThing
    description: An organization such as a company or university.
    attributes:
      founding_date:
        range: date
        description: When the organization was founded.
      employees:
        range: Person
        multivalued: true
        inverse: employed_by
  HasAliases:
    mixin: true
    description: A mixin applied to any class that can have aliases.
    attributes:
      aliases:
        multivalued: true
  Container:
    tree_root: true
    attributes:
      persons:
        range: Person
        multivalued: true
        inlined_as_list: true
      organizations:
        range: Organization
        multivalued: true
        inlined_as_list: true

slots:
  primary_email:
    slot_uri: schema:email
    pattern: "^\\S+@[\\S+\\.]+\\S+"
    description: The main email address of a person.
  birth_date:
    range: date
    slot_uri: schema:birthDate
  age_in_years:
    range: integer
    minimum_value: 0
    maximum_value: 999
  gender:
    range: GenderType
  employed_by:
    range: Organization
    deprecated: Use employment history instead.

enums:
  GenderType:
    description: Gender of a person.
    permissible_values:
      nonbinary man:
        meaning: GSSO:009254
      nonbinary woman:
        meaning: GSSO:009253
      transgender woman:
        meaning: GSSO:000384
      cisgender man:
        description: A man whose gender matches the sex assigned at birth.
